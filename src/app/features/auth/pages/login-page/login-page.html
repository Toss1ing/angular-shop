<section class="login-page">
  <div class="login-page__card">
    <div class="login-page__intro">
      <div class="login-page__icon">
        <mat-icon>lock_open</mat-icon>
      </div>
      <h1 class="login-page__title">Sign in</h1>
      <p class="login-page__subtitle">Use your account to continue shopping</p>
    </div>

    <form class="login-page__form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <mat-form-field class="login-page__field" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field class="login-page__field" appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <p class="login-page__error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button
        mat-flat-button
        class="login-page__submit"
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
      <a
        class="login-page__signin-link"
        (click)="openSingUpPage()"
      >You don't have an accout? Create account</a>
    </form>
  </div>
</section>
