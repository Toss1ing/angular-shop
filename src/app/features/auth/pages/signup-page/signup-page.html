<section class="signin-page">
  <div class="signin-page__card">

    <div class="signin-page__intro">
      <div class="signin-page__icon">
        <mat-icon>lock_open</mat-icon>
      </div>
      <h1 class="signin-page__title">
        Sign up
      </h1>
      <p class="signin-page__subtitle">
        Create your account for shopping
      </p>
    </div>
    <form
      class="signin-page__form"
      [formGroup]="signupForm"
      (ngSubmit)="submit()"
    >
      <mat-form-field
        class="signin-page__field"
        appearance="outline"
      >
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          autocomplete="email"
        />
        <mat-error *ngIf="signupForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="signupForm.get('email')?.hasError('email')">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field
        class="signin-page__field"
        appearance="outline"
      >
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        <mat-error *ngIf="signupForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="signupForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <p
        class="signin-page__error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </p>

      <button
        mat-flat-button
        class="signin-page__submit"
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
      <a class="signin-page__login-link" (click)="openLoginPage()">
        You already has an accont? Login
      </a>
    </form>
  </div>
</section>
