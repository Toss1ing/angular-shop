<mat-card class="product-card">
  <div class="product-card__image-wrap">
    <img [src]="product.image" [alt]="product.title" />
  </div>

  <mat-card-content class="product-card__content">
    <h3 class="product-card__title" (click)="openProduct()">{{ product.title }}</h3>
    <p class="product-card__description">{{ product.description }}</p>
  </mat-card-content>

  <div
    class="product-card__admin"
    *ngIf="isAuthenticated"
    (click)="$event.stopPropagation()"
  >
    <button mat-stroked-button type="button" (click)="editProduct($event)">Edit</button>
    <button
      mat-stroked-button
      type="button"
      class="product-card__delete"
      [disabled]="isDeleting"
      (click)="deleteProduct($event)"
    >
      Delete
    </button>
  </div>

  <p class="product-card__action-message" *ngIf="actionMessage">{{ actionMessage }}</p>

  <div class="product-card__footer">
    <p class="product-card__price">{{ product.price | currency: 'EUR' }}</p>
    <app-product-cart-actions [product]="product" />
  </div>
</mat-card>
